rate_limits:

  - method: POST
    path: /me/toggle-status
    requests: 1
    window_seconds: 3600

  - method: GET
    path: /connections/sellers/directory
    requests: 30
    window_seconds: 60

  - method: GET
    path: /connections/my-sellers
    requests: 30
    window_seconds: 60

  - method: POST
    path: /connections/request
    requests: 10
    window_seconds: 60

  - method: DELETE
    path: /connections/my-sellers/{seller_id}
    requests: 10
    window_seconds: 60